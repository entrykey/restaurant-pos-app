name: Frontend Auto-Deploy & Notify

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to AWS EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /var/www/restaurant-pos-app
            git checkout production
            git pull origin production
            npm install --legacy-peer-deps
            npm run build
            echo "Frontend build and deployment complete!"
          EOF

      - name: Send Email on Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Frontend Deployment Successful!"
          body: "Your latest React frontend changes have been built and deployed to AWS EC2!"
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Frontend Deployment Failed!"
          body: "The frontend build failed. Check GitHub Actions logs."
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions